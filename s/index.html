<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared note · Denominator</title>
<meta name="description" content="A study note shared from Denominator.">
<link rel="icon" href="../icon.png">
<style>
  :root { --bg:#000; --card:#111114; --line:#26262C; --text:#ECEBF2; --soft:#C3C1CE; --muted:#8F8DA0; --accent:#F2C47E; --moon:#B9A8F0; --teal:#8AD6C6; --mark:rgba(255,213,79,.36); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Hind Siliguri",sans-serif; }
  main { max-width:680px; margin:0 auto; padding:24px 16px 120px; }
  .brand { display:flex; align-items:center; gap:10px; color:var(--soft); text-decoration:none; font-weight:600; }
  .brand img { width:28px; height:28px; border-radius:8px; }
  h1 { font-family:Georgia,serif; font-size:30px; line-height:1.2; margin:24px 0 6px; }
  .meta { color:var(--muted); font-size:14px; }
  .hook { color:var(--accent); font-weight:600; margin:14px 0 0; }
  .card { background:var(--card); border-radius:22px; padding:18px 18px 8px; margin:16px 0; }
  .label { font-size:12px; letter-spacing:1.2px; font-weight:700; color:var(--muted); text-transform:uppercase; margin:0 0 8px; }
  mark { background:var(--mark); color:inherit; padding:0 2px; border-radius:3px; }
  ul { padding-left:20px; margin:0 0 10px; } li { margin:4px 0; }
  .flow { list-style:none; padding:0; counter-reset:s; }
  .flow li { counter-increment:s; background:rgba(127,166,248,.12); border:1px solid rgba(127,166,248,.4); border-radius:14px; padding:10px 12px 10px 46px; position:relative; margin:0 0 10px; }
  .flow li::before { content:counter(s); position:absolute; left:12px; top:10px; width:24px; height:24px; border-radius:50%; background:var(--moon); color:#15131C; font-weight:800; font-size:13px; display:grid; place-items:center; }
  .note + .note { border-top:1px solid var(--line); margin-top:28px; padding-top:8px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(0,0,0,.92); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar div { max-width:680px; margin:0 auto; display:flex; gap:10px; }
  .btn { flex:1; text-align:center; padding:14px; border-radius:999px; font-weight:700; text-decoration:none; }
  .primary { background:var(--accent); color:#1A1408; } .ghost { border:1px solid var(--line); color:var(--text); }
  .msg { color:var(--soft); margin-top:40px; }
</style>
</head>
<body>
<main>
  <a class="brand" href="../"><img src="../icon.png" alt="">Denominator</a>
  <div id="out"><p class="msg">Loading…</p></div>
</main>
<nav class="bar"><div>
  <a class="btn primary" id="open" href="#">Open in Denominator</a>
  <a class="btn ghost" href="../">Get the app</a>
</div></nav>
<script>
// Supabase public (publishable) key: it can only read links people chose to share.
const SB = 'https://pidfsvffhpdfxwbswrgx.supabase.co';
const KEY = 'sb_publishable_IcRgAvxF61tFRFq1cVuGUg_4HKJJv-t';
const id = new URLSearchParams(location.search).get('id') || '';
const out = document.getElementById('out');
document.getElementById('open').href = 'com.denominator.denominator://share/' + encodeURIComponent(id);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const marked = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<mark>$1</mark>');
const list = v => { if (typeof v === 'string') { try { v = JSON.parse(v); } catch { v = []; } } return Array.isArray(v) ? v : []; };

function noteHtml(n) {
  const concepts = list(n.key_concepts), takeaways = list(n.takeaways), diagrams = list(n.diagrams);
  const flow = diagrams.find(d => d && d.type === 'flow');
  let h = `<section class="note"><h1>${esc(n.title)}</h1>`;
  if (n.hook) h += `<p class="hook">${marked(n.hook)}</p>`;
  if (n.main_idea) h += `<div class="card"><p class="label">Main idea</p><p>${marked(n.main_idea)}</p></div>`;
  if (n.body) h += `<div class="card"><p>${marked(n.body)}</p></div>`;
  if (flow && list(flow.steps).length) h += `<div class="card"><p class="label">At a glance</p><ol class="flow">${list(flow.steps).map(s => `<li>${marked(s)}</li>`).join('')}</ol></div>`;
  if (concepts.length) h += `<div class="card"><p class="label">Key ideas</p><ul>${concepts.map(c => `<li>${marked(c)}</li>`).join('')}</ul></div>`;
  if (takeaways.length) h += `<div class="card"><p class="label">Takeaways</p><ul>${takeaways.map(c => `<li>${marked(c)}</li>`).join('')}</ul></div>`;
  return h + '</section>';
}

(async () => {
  if (!/^[A-Za-z0-9]{6,20}$/.test(id)) { out.innerHTML = '<p class="msg">This link looks broken.</p>'; return; }
  try {
    const r = await fetch(`${SB}/rest/v1/shared_notes?id=eq.${id}&revoked=is.false&select=kind,title,data`, { headers: { apikey: KEY } });
    const rows = await r.json();
    if (!Array.isArray(rows) || !rows.length) { out.innerHTML = '<p class="msg">This link was turned off or doesn\'t exist.</p>'; return; }
    const { kind, title, data } = rows[0];
    const notes = kind === 'group' ? list(data.notes) : [data.note];
    document.title = `${title} · Denominator`;
    let h = data.by ? `<p class="meta">Shared by ${esc(data.by)}${kind === 'group' ? ` · ${notes.length} notes in “${esc(title)}”` : ''}</p>` : '';
    out.innerHTML = h + notes.filter(Boolean).map(noteHtml).join('');
  } catch { out.innerHTML = '<p class="msg">Couldn\'t load it. Check your internet and try again.</p>'; }
})();
</script>
</body>
</html>
